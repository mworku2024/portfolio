<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visit Denver</title>
        <link rel="stylesheet" href="style.css">
        
    </head>

    <body>

        <!-- HERO SECTION -->
        <div class="denver">

        </div>

        <div class="images">
        <h3>Top three activities to do at Denver</h3>
        </div>
        <div class="activity-images">

                <img src="images/park.jpg" alt="city park in denver" >
            <h3>City Park </h3>
            </div>
            <div class="theater-container">
                <img src="images/theater.jpg">
            <h3>Theater</h3>
            </div>

            <div class="sport-container">
                <img src="images/sport.jpg">
            <h3>Sports</h3>
            </div>
        </div>

        <!-- GUIDE SECTION -->
        <div class="guide">
        <h3>Your guide</h3>
        <p>"I have lived at Denver for over 30 years, so I can show you all of its best parts and hidden secrets."</p>
        <h4>Kelly Jackson</h4>
            <img src="images/kelly.png" width="100px">
