<body>

<h1>Psalm Collection NIV</h1>
    <div class="container">
    <p class="subtitle">Tap to reveal Psalms Verses</p>



        <select name="psalm" id="psalmselect">
        <option value="">Choose A psalm</option>
        <option value="0">Psalm 91:14-16</option>
        <option value="1">Psalm 119:140</option>
        <option value="2">Psalm 33:11</option>
        <option value="3">Psalm 30:5</option>
        <option value="4">Psalm 36:5</option>
        </select>
        <div class="button-row">
            <button id="themeBtn" onclick="toggleTheme()">
                🌙 Dark Mode
            </button>
        <button onclick="selectPsalm()">show verse</button>
        <button onclick="randomPsalm()">🎲 Random Psalm</button>
        <button onclick="saveFavorite()">❤️ Save Favorite</button>
        </div>
    <label for="fontsizeslider">Font Size</label>
        <input
        type="range"
        id="fontSizeSlider"
        min="16"
        max="40"
        value="30"
        oninput="changeFontSize()">
    <span id="fontSizeValue">30px</span>
    <div id="psalmBox"></div>
    <h3>Favorite Psalms</h3>
        <input
        type="text"
        id="searchFavorites"
        placeholder="search favorites"
        oninput="searchFavorites()">
    <ul id="favoritesList"></ul>
    </div>
    <script>
        const psalm = [ {text:"Because he loves me, says the Lord, \"I will rescue him ; I will protect him,for he acknowledges my name He will call on me and I will answer him I will be with him in trouble I will deliver him and honor him with long life  will satisfy him and show him my salvation. - Psalm 91:14-16 ", scroll:true }
        , {text:`Your promises have been thoroughly tested, and your servant loves them.- Psalm 119:140`, scroll:false}
        ,{text:"But the plans of the Lord stand firm forever,the purpose of his heart through all generation.-Psalm 33:11",scroll:false}
        , {text:"For his anger lasts only a moment, but his favor lasts a lifetime; weeping may stay for the night, but rejoicing comes in the morning - Psalm 30:5",scroll:false}
        ,{text:"Your love, Lord ,reaches to the heavens your faithfulness to the skies. - Psalm 36:5",scroll:false}

    ]
    function selectPsalm(){
            const box = document.getElementById('psalmBox');
            const select = document.getElementById("psalmselect");

            if (select.value === "") {
                    box.textContent = "please select a psalm first.";
                    return;
                }
                const selectedPsalm = psalm[select.value];

                //remove scrolling first
                box.classList.remove("scrollable");

                //start animation
                box.style.opacity = "0";
                box.style.transform = "translateY(20px)";

                setTimeout(()=> {
                    //display the verse
                    box.textContent = psalm[select.value].text;
                    //only enable scrolling when scroll is true
                    if (selectedPsalm.scroll){
                            box.classList.add("scrollable");
                        }

                        //finish animation
                        box.style.opacity = "1";
                        box.style.transform = "translateY(0)";
                    }, 200);
                }

                let lastPsalm = -1

                function randomPsalm(){
                        const box = document.getElementById("psalmBox");
                        const select = document.getElementById("psalmselect");

                        const randomIndex = Math.floor(Math.random() * psalm.length);
                        select.value = randomIndex;

                        box.style.opacity = "0";
                        box.style.transform = "translateY(20px)";

                        setTimeout(() => {
                            box.textContent = psalm[randomIndex].text;
                            box.style.opacity = "1";
                            box.style.transform = "translateY(0)";
                        }, 200);
                    }

                    function toggleTheme() {
                            document.body.classList.toggle("dark");

                            const btn = document.getElementById("themeBtn");

                            if(document.body.classList.contains("dark")){
                                btn.textContent = "☀️ Light Mode";
                                localStorage.setItem("theme","dark");
                            } else{
                                btn.textContent = "🌙 Dark Mode";
                                localStorage.setItem("theme","light");
                            }
                        }

                        function changeFontSize() {
                                const slider = document.getElementById("fontSizeSlider");
                                const box = document.getElementById("psalmBox");
                                const value = document.getElementById("fontSizeValue");

                                box.style.fontSize = slider.value + "px";
                                value.textContent = slider.value + "px";
                                localStorage.setItem("fontSize", slider.value);
                            }
                            window.onload = () => {
                                const savedSize = localStorage.getItem("fontSize");
                                const savedTheme = localStorage.getItem("theme");
                                renderFavorites();

                                if (savedSize) {
                                        document.getElementById("fontSizeSlider").value = savedSize;
                                        document.getElementById("fontSizeValue").textContent = savedSize + "px";
                                        document.getElementById("psalmBox").style.fontSize = savedSize + "px";
                                    }
                                    if(savedTheme === "dark"){
                                        document.body.classList.add("dark");
                                        document.getElementById("themeBtn").textContent = "☀️ Light Mode";
                                    }
                                };

                                let favorites =
                                JSON.parse(localStorage.getItem("favorites")) || [];

                                function saveFavorite() {

                                        const select =
                                        document.getElementById("psalmselect");
                                        if(select.value === "") return;

                                        const verse = psalm [select.value];

                                        if(!favorites.includes(verse)) {
                                            favorites.push(verse);
                                            localStorage.setItem(
                                                "favorites",
                                                JSON.stringify(favorites)
                                            );
                                            renderFavorites();
                                        }
                                    }


                                    function renderFavorites(data = favorites) {
                                            const list = document.getElementById("favoritesList");
                                            list.innerHTML = "";

                                            data.forEach((verse) => {
                                                const li = document.createElement("li");
                                                li.textContent = verse + " ";

                                                const button = document.createElement("button");
                                                button.textContent = "❌";
                                                button.setAttribute("aria-label", "Remove favorite");

                                                button.addEventListener("click", () => {
                                                    const originalIndex = favorites.indexOf(verse);

                                                    if (originalIndex !== -1) {
                                                            removeFavorite(originalIndex);
                                                            searchFavorites();
                                                        }
                                                });

                                                li.appendChild(button);
                                                list.appendChild(li);
                                        });

                                        if (data.length === 0) {
                                            list.innerHTML = "<li>No matching favorites found.</li>";
                                            }
                                        }
                                        function searchFavorites() {
                                                const searchText = document.getElementById("searchFavorites")
                                                .value
                                                .toLowerCase();

                                                const filteredFavorites =
                                                favorites.filter(verse =>
                                                verse.toLowerCase ()
                                                .includes(searchText)
                                            );
                                            renderFavorites(filteredFavorites);

                                        }
                                        function removeFavorite(index) {
                                                favorites.splice(index, 1);
                                                localStorage.setItem(
                                                    "favorites",
                                                    JSON.stringify(favorites)
                                                );
                                                renderFavorites();
                                            }

                                        </script>
                                    </body>
