        <style>
            body{
                margin: 0;
                background-color: #1e3a5f;
            

            }
            header{
                display: flex;
                justify-content: center;

                border-radius: 10px;
                gap: 20px;

                border: 2px solid white;
            }
            h1{
                color:rgb(249, 249, 249);
                text-shadow: 1px 2px 5px  orangered;
                font-family: 'Times New Roman', Times, serif;
            }

            ul li{
                list-style-type: none;

            }
            nav ul{
                display: flex;
                justify-content: center;
                flex-direction: row;
                gap: 10px;



            }
            a{
                text-decoration: none;
                color: white;
                font-size: 20px;
                
                border-radius: 5px;
                font-family: 'Times New Roman', Times, serif;


            }
            nav a:link{

                padding: 4px;


            }
            nav a:hover{
                text-decoration:underline;

            }
            .search-button{
                background-color: lightblue;
                cursor: pointer;
                padding: 10px 15px;
                border-radius: 8px;
                border: none;
            }
            .search{
                display: flex;
                justify-content: center;
                align-items: center;
                margin-top: 40px;
                gap: 10px;



            }
            .movies{
                display: flex;
                justify-content: center;
                gap: 10px;
                flex-wrap: wrap;
                margin-top: 70px;


            }
            .movie{
                position: relative;

            }
            .movie::before{
                content: "";
                position: absolute;
                inset: 0;
                background: rgba(0,0,0,0.4);
                border-radius: 10px;
                opacity: 0;
                transition: 0.3s;
            }
            .movie:hover::before{
                opacity: 1;
            }
            .movie::after{
                content:"▶";
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-size: 30px;
                color: whitesmoke;
                opacity: 0;
                transition: 0.3s;
            }
            .movie:hover::after{
                opacity: 1;
                cursor: pointer;
            }
            .movies img{

                transition: transform 0.3s;
                width: 150px;
                height: 220px;
                object-fit: cover;
                border-radius: 16px;
            }
            .movie img:hover{
                transform: scale(1.05);
                transition: 0.3s;


            }

            .container{
                max-width: 1000px;
                margin: 0 auto;
                padding: 10px;
            }
            .search-input{
                height: 20px;
                padding: 5px;
            }
            h4{
                color: white;
                text-align: center;
                border: 4px solid white;
                border-radius: 20px;
                cursor: pointer;


            }

            @media(max-width:600px){
                .movies img{
                    width:120px;
                    height:180px;}
                }
                nav ul{
                    flex-direction: row;
                    align-items: flex;
                }
                :root{
                    --primary:#1e3a5f;
                    --accent:orange;
                }
                body{
                    background-color: var(--primary);
                }

            </style>
        </head>
